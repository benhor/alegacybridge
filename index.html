<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A LegacyBridge Foundation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1e1e1e; /* Creates a clean, premium background canvas */
        }
        .fp-iframe {
            border: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Using official parameters to force clean fullscreen execution -->
    <iframe 
        src="https://heyzine.com" 
        class="fp-iframe" 
        scrolling="no" 
        allowfullscreen="allowfullscreen">
    </iframe>
</body>
</html>
