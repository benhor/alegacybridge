<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A LegacyBridge Foundation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1e1e1e; /* Gives a premium, dark canvas background */
        }
        /* This wrapper scales the iframe up and crops out external platform headers */
        .wrapper {
            position: absolute;
            top: -50px; /* Adjust this value if you need to hide a top bar */
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <iframe src="https://heyzine.com"></iframe>
    </div>
</body>
</html>
