
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retired Seniors Service Awards - Nomination Form</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f5ef;
  margin: 0;
  padding: 20px;
  color: #333;
}
.container {
  max-width: 700px;
  margin: 30px auto;
  background: white;
  padding: 30px;
  border-top: 8px solid #b08d35;
  border-radius: 8px;
}
h1 {
  color: #174b35;
  text-align: center;
}
h2 {
  color: #a17b24;
  text-align: center;
}
p { line-height: 1.6; }
label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}
input, textarea, select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-size: 16px;
}
textarea { min-height: 110px; }
button {
  margin-top: 25px;
  width: 100%;
  padding: 15px;
  background: #174b35;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 17px;
  cursor: pointer;
}
.note {
  background: #f7f1df;
  padding: 12px;
  border-left: 4px solid #b08d35;
}
</style>
</head>

<body>
<div class="container">

<h1>RETIRED SENIORS SERVICE AWARDS</h1>
<h2>ONLINE NOMINATION FORM</h2>

<p class="note">
Thank you for helping us recognize a retired senior
who has made a meaningful contribution to the community.
Please complete the information below.
</p>

<form action="mailto:legacybridge@consultant.com"
method="post" enctype="text/plain">

<label>Nominee's Full Name</label>
<input type="text" name="Nominee Name" required>

<label>Nominee's Email Address</label>
<input type="email" name="Nominee Email">

<label>Nominee's Telephone Number</label>
<input type="tel" name="Nominee Phone">

<label>Nominee's Community Service or Profession</label>
<input type="text" name="Profession or Service">

<label>Why are you nominating this person?</label>
<textarea name="Reason for Nomination" required></textarea>

<label>Your Name (Person Submitting Nomination)</label>
<input type="text" name="Nominator Name" required>

<label>Your Email Address</label>
<input type="email" name="Nominator Email" required>

<label>Your Telephone Number</label>
<input type="tel" name="Nominator Phone">

<button type="submit">SUBMIT NOMINATION</button>

</form>

<p style="text-align:center; margin-top:25px;">
A Legacy Bridge<br>
Retired Seniors Service Awards
</p>

</div>
</body>
</html>
